    /* HUD Corner Reticles */

    /* Dynamic Scene Transition Animations */

  <!-- Audio Synthesis & Dynamic Visual Effects Engine -->
  <script>
    // =========================================================================
    // PROCEDURAL AUDIO SYNTHESIZER & SFX ENGINE (Web Audio API)
    // =========================================================================
    class CinematicAudioEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.masterGain = null;
        this.mediaStreamDest = null;
        this.beatInterval = null;
      }
      
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          
          // Stream destination for video export audio recording
          this.mediaStreamDest = this.ctx.createMediaStreamDestination();
          
          this.masterGain.connect(this.ctx.destination);
          this.masterGain.connect(this.mediaStreamDest);
          
          this.startAmbientSoundtrack();
        }
      }
      
      startAmbientSoundtrack() {
        if (!this.ctx || this.isMuted) return;
        
        // Sci-Fi cinematic chord drone (Root A1 55Hz + D2 73.4Hz + E2 82.4Hz)
        const freqs = [55, 73.41, 110, 164.81];
        freqs.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();
          
          osc.type = idx % 2 === 0 ? 'sawtooth' : 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(220 + idx * 60, this.ctx.currentTime);
          
          gain.gain.setValueAtTime(0.04 / (idx + 1), this.ctx.currentTime);
          
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          osc.start();
        });
        
        // Procedural rhythmic pulse every 800ms
        if (!this.beatInterval) {
          this.beatInterval = setInterval(() => {
            if (!this.isMuted && this.ctx && this.ctx.state === 'running') {
              this.playSubtlePulse();
            }
          }, 800);
        }
      }
      
      playSubtlePulse() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(60, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.15);
      }
      
      playWhoosh() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(950, now + 0.35);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.7);
        
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.7);
      }
      
      playScanBeep() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.setValueAtTime(1800, now + 0.09);
        osc.frequency.setValueAtTime(2400, now + 0.18);
        
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.28);
      }
      
      playBassDrop() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.95);
        
        gain.gain.setValueAtTime(0.55, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.95);
      }
      
      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.masterGain) {
          this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 0.3, this.ctx.currentTime);
        }
        return this.isMuted;
      }
    }
    
    const audio = new CinematicAudioEngine();

    // =========================================================================
    // CANVAS VFX ENGINE: 3D TERRAIN, HYDROLOGY, ORBIT SATELLITES & CYBER HUD
    // =========================================================================
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    function resizeCanvas() {
      const rect = document.getElementById('video-wrapper').getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    // VFX Particle System
    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 1.8;
        this.vy = (Math.random() - 0.5) * 1.8;
        this.size = Math.random() * 2.2 + 1;
        this.alpha = Math.random() * 0.7 + 0.2;
        this.color = Math.random() > 0.5 ? '#00f0ff' : (Math.random() > 0.5 ? '#00ff88' : '#0077fe');
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset();
      }
      draw(c) {
        c.save();
        c.globalAlpha = this.alpha;
        c.fillStyle = this.color;
        c.shadowBlur = 12;
        c.shadowColor = this.color;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }
    const particles = Array.from({ length: 110 }, () => new Particle());
    
    // 3D Terrain Wireframe Simulation
    let terrainScroll = 0;
    function draw3DTerrain(c, time, color = 'rgba(0, 240, 255, 0.35)') {
      c.save();
      const horizon = height * 0.62;
      const fov = 380;
      const rows = 20;
      const cols = 32;
      
      c.strokeStyle = color;
      c.lineWidth = 1.2;
      
      terrainScroll += 0.9;
      if (terrainScroll > 32) terrainScroll = 0;
      
      for (let r = 0; r < rows; r++) {
        const z = (rows - r) * 22 - terrainScroll;
        if (z <= 10) continue;
        const scale = fov / z;
        const yScreen = horizon + (r * 18);
        
        c.beginPath();
        for (let col = 0; col <= cols; col++) {
          const xWorld = (col - cols / 2) * 42;
          const xScreen = width / 2 + (xWorld * scale);
          const elevation = Math.sin(col * 0.38 + time * 2) * Math.cos(r * 0.32) * 38;
          const yPos = yScreen - (elevation * scale);
          
          if (col === 0) c.moveTo(xScreen, yPos);
          else c.lineTo(xScreen, yPos);
        }
        c.stroke();
      }
      
      // Vertical grid cross-lines
      for (let col = 0; col <= cols; col += 2) {
        c.beginPath();
        for (let r = 0; r < rows; r++) {
          const z = (rows - r) * 22 - terrainScroll;
          if (z <= 10) continue;
          const scale = fov / z;
          const yScreen = horizon + (r * 18);
          const xWorld = (col - cols / 2) * 42;
          const xScreen = width / 2 + (xWorld * scale);
          const elevation = Math.sin(col * 0.38 + time * 2) * Math.cos(r * 0.32) * 38;
          const yPos = yScreen - (elevation * scale);
          
          if (r === 0) c.moveTo(xScreen, yPos);
          else c.lineTo(xScreen, yPos);
        }
        c.stroke();
      }
      c.restore();
    }
    
    // Hydrology Water Stream Animation
    function drawHydrologyStreams(c, time) {
      c.save();
      c.lineWidth = 3.5;
      c.strokeStyle = '#00f0ff';
      c.shadowColor = '#00f0ff';
      c.shadowBlur = 18;
      
      // Main river spine
      c.beginPath();
      c.moveTo(width * 0.18, 0);
      c.bezierCurveTo(width * 0.32, height * 0.3, width * 0.38, height * 0.6, width * 0.78, height);
      c.stroke();
      
      // Tributary 1
      c.lineWidth = 2.2;
      c.strokeStyle = '#00ff88';
      c.shadowColor = '#00ff88';
      c.beginPath();
      c.moveTo(width * 0.72, 0);
      c.bezierCurveTo(width * 0.62, height * 0.24, width * 0.48, height * 0.4, width * 0.36, height * 0.44);
      c.stroke();
      
      // Tributary 2
      c.beginPath();
      c.moveTo(0, height * 0.42);
      c.bezierCurveTo(width * 0.16, height * 0.46, width * 0.26, height * 0.54, width * 0.42, height * 0.64);
      c.stroke();
      
      // Check Dam node pulsating on river
      const damX = width * 0.42;
      const damY = height * 0.64;
      
      c.fillStyle = '#ff0055';
      c.shadowColor = '#ff0055';
      c.shadowBlur = 25;
      c.beginPath();
      c.arc(damX, damY, 9 + Math.sin(time * 6) * 3.5, 0, Math.PI * 2);
      c.fill();
      
      // Water flow pulses
      const pulseProgress = (time * 1.6) % 1;
      const px = width * 0.18 + (width * 0.6 * pulseProgress);
      const py = height * pulseProgress;
      c.fillStyle = '#ffffff';
      c.shadowColor = '#00f0ff';
      c.beginPath();
      c.arc(px, py, 4.5, 0, Math.PI * 2);
      c.fill();
      
      c.restore();
    }
    
    // Forensics Laser Scanning Animation
    let scanY = 0;
    function drawForensicScanner(c) {
      c.save();
      scanY = (scanY + 3.5) % height;
      
      const grad = c.createLinearGradient(0, scanY - 35, 0, scanY + 35);

        // Update Timecode
        const mins = Math.floor(totalElapsedSeconds / 60);
        const secs = Math.floor(totalElapsedSeconds % 60);
        const millis = Math.floor((totalElapsedSeconds % 1) * 100);
        timecode.textContent = `00:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(millis).padStart(2, '0')}`;
        progressTime.textContent = `${mins}:${String(secs).padStart(2, '0')} / ${Math.floor(totalDuration / 60)}:${String(Math.floor(totalDuration % 60)).padStart(2, '0')}`;
        timelineFill.style.width = `${(totalElapsedSeconds / totalDuration) * 100}%`;
        
        // Animate Audio EQ
        const eqBars = document.querySelectorAll('.eq-bar');
        eqBars.forEach(bar => {
          bar.style.height = `${Math.floor(Math.random() * 16) + 4}px`;
        });
        
        // Scene Transition Check
        if (sceneElapsed >= currentScene.duration) {
          if (currentSceneIndex < scenes.length - 1) {
            currentSceneIndex++;
            sceneStartTime = performance.now();
            renderScene(currentSceneIndex);
          } else {
            // Loop back or finish
            currentSceneIndex = 0;
            sceneStartTime = performance.now();
            renderScene(0);
          }
        }
      }
      requestAnimationFrame(updateTimeline);
    }
    
    // Initial Render
    renderScene(0);
    requestAnimationFrame(updateTimeline);
    
    // Play / Pause Controls
    btnPlay.addEventListener('click', () => {
      audio.init();
      isPlaying = !isPlaying;
      playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      if (!isPlaying && 'speechSynthesis' in window) {
        window.speechSynthesis.pause();
      } else if (isPlaying && 'speechSynthesis' in window) {
        window.speechSynthesis.resume();
      }
    });
    
    document.getElementById('btn-restart').addEventListener('click', () => {
      jumpToScene(0);
    });
    
    document.getElementById('btn-audio').addEventListener('click', () => {
      audio.init();
      const muted = audio.toggleMute();
      document.getElementById('audio-icon').textContent = muted ? 'volume_off' : 'volume_up';
      if (muted && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    });

    // =========================================================================
    // EXPORT VIDEO RECORDER (MediaRecorder API - 60 FPS Stream + Procedural Audio)
    // =========================================================================
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    
    const btnRecord = document.getElementById('btn-record-video');
    btnRecord.addEventListener('click', async () => {
      audio.init();
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });
    
    function startRecording() {
      recordedChunks = [];
      const videoStream = canvas.captureStream(60); // 60 FPS recording
      
      let combinedStream = videoStream;
      if (audio.mediaStreamDest) {
        combinedStream = new MediaStream([
          ...videoStream.getVideoTracks(),
          ...audio.mediaStreamDest.stream.getAudioTracks()
        ]);
      }
      
      const options = { mimeType: 'video/webm; codecs=vp9,opus' };
      try {
        mediaRecorder = new MediaRecorder(combinedStream, options);
      } catch (e) {
        try {
          mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
        } catch (e2) {
          mediaRecorder = new MediaRecorder(combinedStream);
        }
      }
      
      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };
      
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'JalDrishti_Cinematic_Explainer_Video.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        btnRecord.innerHTML = `<span class="material-symbols-outlined text-sm">videocam</span><span>EXPORT 1080P VIDEO</span>`;
        btnRecord.classList.remove('animate-pulse', 'from-amber-600', 'to-red-600');
        isRecording = false;
      };
      
      mediaRecorder.start();
      isRecording = true;
      btnRecord.innerHTML = `<span class="material-symbols-outlined text-sm">stop_circle</span><span>STOP & DOWNLOAD</span>`;
      btnRecord.classList.add('animate-pulse', 'from-amber-600', 'to-red-600');
      
      // Auto jump to start
      jumpToScene(0);
    }
    
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }
  </script>
</body>
</html>
